<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DebtDown - which debt first? the wrong order costs you thousands</title>
<style>
  :root { --bg:#101418; --panel:#161d24; --line:#2a3844; --text:#f0f5f9; --dim:#93a5b4; --accent:#6fc3ff; --good:#8be0a4; --warn:#ffcf7a; --bad:#ff8f7a; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--text); font-family:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:26px 14px 44px; }
  h1 { font-size:30px; }
  .sub { color:var(--dim); margin:6px 0 18px; font-size:14px; text-align:center; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; width:min(680px, 94vw); margin-bottom:14px; }
  .card h2 { font-size:15px; margin-bottom:10px; }
  .row { display:flex; gap:10px; align-items:end; flex-wrap:wrap; }
  input, select { background:#0c1116; border:1px solid var(--line); border-radius:8px; color:var(--text); padding:8px 10px; font-size:13px; }
  label { color:var(--dim); font-size:11px; display:block; margin-bottom:4px; }
  button { background:var(--accent); color:#101418; border:none; border-radius:8px; padding:9px 16px; font-size:13px; font-weight:700; cursor:pointer; }
  .debt { display:grid; grid-template-columns:1fr 90px 80px 80px 28px; gap:8px; align-items:center; background:#0c1116; border:1px solid var(--line); border-radius:10px; padding:10px 12px; margin-top:8px; font-size:13px; }
  .debt .nm { font-weight:700; }
  .debt .x { color:var(--dim); cursor:pointer; text-align:center; }
  .debt .x:hover { color:var(--bad); }
  .vs { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .plan { background:#0c1116; border:1px solid var(--line); border-radius:10px; padding:12px 14px; }
  .plan h3 { font-size:13px; color:var(--dim); text-transform:uppercase; letter-spacing:.05em; margin-bottom:6px; }
  .plan .big { font-size:26px; font-weight:900; }
  .plan .l2 { color:var(--dim); font-size:12px; margin-top:4px; line-height:1.6; }
  .plan.winner { border-color:var(--good); }
  .plan.winner h3 { color:var(--good); }
  .verdict { margin-top:10px; background:#0c1116; border:1px solid var(--good); border-radius:10px; padding:12px 14px; font-size:14px; }
  .verdict b { color:var(--good); }
  .never { border-color:var(--bad); color:var(--bad); }
  .order { color:var(--dim); font-size:12px; margin-top:6px; }
  .order b { color:var(--text); font-weight:600; }
  .empty { color:var(--dim); text-align:center; padding:10px 0; font-size:14px; }
  .foot { margin-top:14px; color:var(--dim); font-size:13px; }
  a { color:var(--accent); text-decoration:none; }
</style>
</head>
<body>
<h1>DebtDown</h1>
<div class="sub">which debt first? the wrong order quietly costs you thousands in interest.</div>

<div class="card">
  <h2>Your debts</h2>
  <div id="debts"><div class="empty">Add your debts below.</div></div>
  <div class="row" style="margin-top:10px">
    <div><label>Name</label><input id="d-name" placeholder="e.g. Visa"></div>
    <div><label>Balance</label><input id="d-balance" type="number" min="0" step="any" placeholder="4000"></div>
    <div><label>APR %</label><input id="d-apr" type="number" min="0" step="any" placeholder="16" style="width:70px"></div>
    <div><label>Min pay</label><input id="d-min" type="number" min="0" step="any" placeholder="80" style="width:80px"></div>
    <button id="add">Add</button>
  </div>
  <div class="row" style="margin-top:12px">
    <div><label>Extra you can pay each month</label><input id="extra" type="number" min="0" step="any" value="200"></div>
  </div>
</div>

<div class="card" id="results" style="display:none">
  <h2>Avalanche vs snowball</h2>
  <div class="vs">
    <div class="plan" id="plan-av">
      <h3>Avalanche - highest APR first</h3>
      <div class="big" id="av-months"></div>
      <div class="l2" id="av-interest"></div>
      <div class="order" id="av-order"></div>
    </div>
    <div class="plan" id="plan-sn">
      <h3>Snowball - smallest balance first</h3>
      <div class="big" id="sn-months"></div>
      <div class="l2" id="sn-interest"></div>
      <div class="order" id="sn-order"></div>
    </div>
  </div>
  <div class="verdict" id="verdict"></div>
</div>

<div class="foot"><a href="index.html">&larr; about</a></div>

<script src="engine.js?v=1"></script>
<script>
(function () {
  var KEY = 'debtdown-v1';
  var debts = [];

  function save() { try { localStorage.setItem(KEY, JSON.stringify(debts)); } catch (e) {} }
  function load() {
    try { var s = JSON.parse(localStorage.getItem(KEY)); if (Array.isArray(s)) debts = s; } catch (e) {}
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function money(n) { return '$' + Math.round(n).toLocaleString(); }
  function fmtMonths(m) {
    if (m >= 600) return 'never';
    var y = Math.floor(m / 12), mo = m % 12;
    return (y ? y + 'y ' : '') + (mo ? mo + 'm' : (y ? '' : '0m'));
  }

  function render() {
    var el = document.getElementById('debts');
    if (!debts.length) { el.innerHTML = '<div class="empty">Add your debts below.</div>'; }
    else {
      el.innerHTML = '';
      debts.forEach(function (d) {
        var row = document.createElement('div');
        row.className = 'debt';
        row.innerHTML = '<span class="nm">' + esc(d.name) + '</span><span>' + money(d.balance) + '</span>' +
          '<span>' + d.apr + '%</span><span>' + money(d.min) + '/mo</span><span class="x" data-id="' + d.id + '">&times;</span>';
        el.appendChild(row);
      });
      el.querySelectorAll('.x').forEach(function (x) {
        x.addEventListener('click', function () {
          debts = debts.filter(function (d) { return d.id !== x.getAttribute('data-id'); });
          save(); render();
        });
      });
    }
    renderResults();
  }

  function renderResults() {
    var box = document.getElementById('results');
    var extra = parseFloat(document.getElementById('extra').value) || 0;
    if (!debts.length) { box.style.display = 'none'; return; }
    box.style.display = '';
    var cmp = DebtDown.compare(debts, extra);
    var av = cmp.avalanche, sn = cmp.snowball;

    document.getElementById('av-months').textContent = av.never ? 'never' : fmtMonths(av.months) + ' to free';
    document.getElementById('sn-months').textContent = sn.never ? 'never' : fmtMonths(sn.months) + ' to free';
    document.getElementById('av-interest').textContent = money(av.totalInterest) + ' total interest';
    document.getElementById('sn-interest').textContent = money(sn.totalInterest) + ' total interest';
    document.getElementById('av-order').innerHTML = 'payoff order: <b>' + av.order.map(esc).join(' &rarr; ') + '</b>';
    document.getElementById('sn-order').innerHTML = 'payoff order: <b>' + sn.order.map(esc).join(' &rarr; ') + '</b>';

    var planAv = document.getElementById('plan-av'), planSn = document.getElementById('plan-sn');
    planAv.classList.remove('winner'); planSn.classList.remove('winner');
    var v = document.getElementById('verdict');
    if (av.never || sn.never) {
      v.className = 'verdict never';
      v.textContent = 'At these minimums the balance grows forever - interest outruns the payments. Raise the extra or the minimums.';
    } else if (cmp.interestSaved > 0 || cmp.monthsSaved > 0) {
      planAv.classList.add('winner');
      v.className = 'verdict';
      v.innerHTML = 'Avalanche wins here: <b>' + money(cmp.interestSaved) + ' less interest</b>' +
        (cmp.monthsSaved ? ' and <b>' + cmp.monthsSaved + ' months sooner</b>' : '') +
        '. Snowball wins on motivation - quick kills keep people going - so if the gap is small, take the wins.';
    } else {
      v.className = 'verdict';
      v.innerHTML = 'Both strategies cost the same here. Take the <b>snowball</b> - the early wins make it easier to stick with.';
    }
  }

  document.getElementById('add').addEventListener('click', function () {
    var name = document.getElementById('d-name').value.trim();
    var balance = parseFloat(document.getElementById('d-balance').value);
    if (!name || !balance) return;
    debts.push({
      id: 'd' + Date.now(),
      name: name,
      balance: balance,
      apr: parseFloat(document.getElementById('d-apr').value) || 0,
      min: parseFloat(document.getElementById('d-min').value) || 0
    });
    document.getElementById('d-name').value = '';
    document.getElementById('d-balance').value = '';
    document.getElementById('d-apr').value = '';
    document.getElementById('d-min').value = '';
    save(); render();
  });
  document.getElementById('extra').addEventListener('input', renderResults);

  // test hook
  window.__dd = {
    clear: function () { debts = []; save(); render(); },
    add: function (name, balance, apr, min) {
      debts.push({ id: 'd' + Math.random(), name: name, balance: balance, apr: apr, min: min });
      save(); render();
    },
    setExtra: function (n) { document.getElementById('extra').value = n; renderResults(); },
    read: function () {
      return {
        avMonths: document.getElementById('av-months').textContent,
        snMonths: document.getElementById('sn-months').textContent,
        avInterest: document.getElementById('av-interest').textContent,
        snInterest: document.getElementById('sn-interest').textContent,
        avOrder: document.getElementById('av-order').textContent,
        snOrder: document.getElementById('sn-order').textContent,
        verdict: document.getElementById('verdict').textContent
      };
    }
  };

  load();
  render();
})();
</script>
</body>
</html>
